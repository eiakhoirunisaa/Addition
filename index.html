<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal emoji addition • 1–20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Importing Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Hand+Pre:wght@400..700&family=Fredoka:wght@300..700&display=swap');

        :root {
            --font-ui: 'Fredoka', sans-serif;
            --font-numbers: 'Edu NSW ACT Hand Pre', cursive;
        }

        body {
            font-family: var(--font-ui);
            touch-action: none;
            background: #eff6ff;
        }

        h1, p, button, .ui-text {
            font-family: var(--font-ui) !important;
            letter-spacing: 0.01em;
        }

        #num1, #num2, #drop-target, .option-tile, .score-val {
            font-family: var(--font-numbers) !important;
            font-weight: 700;
        }

        .drop-zone {
            min-height: 80px;
            transition: all 0.3s ease;
        }
        .correct {
            background-color: #d1fae5 !important;
            border-color: #10b981 !important;
            animation: bounce 0.5s ease;
        }
        .wrong {
            animation: shake 0.4s ease;
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* EMOJI STYLES – replace images with big, friendly emoji */
        .item-emoji { 
            font-size: 40px; 
            line-height: 1;
            cursor: grab; 
            display: inline-block; 
            user-select: none;
            transition: transform 0.2s; 
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.1));
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .item-emoji:active { cursor: grabbing; }
        
        .collection-area { 
            min-width: 150px; 
            min-height: 110px; 
            border: 3px dashed #94a3b8; 
            background: #f8fafc; 
            border-radius: 20px; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-content: center; 
            padding: 8px;
            gap: 4px;
            transition: border-color 0.2s;
        }
        .collection-area.active { border-color: #3b82f6; background: #eff6ff; }
        
        .source-box { 
            min-height: 100px; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-content: center; 
            width: 150px; 
            background: #fef9c3;
            border-radius: 24px;
            padding: 6px;
        }

        #congrats-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        #modal-content {
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .zoom-out-pop {
            animation: zoomOutPop 0.8s ease-out forwards;
        }

        @keyframes zoomOutPop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- Congrats Modal (same) -->
    <div id="congrats-modal">
        <div id="modal-content" class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm mx-4 border-4 border-green-400">
            <div id="modal-emoji" class="mb-4">
                <img src="https://media-public.canva.com/3mBA8/MAG8el3mBA8/1/tl.png" class="w-24 h-24 mx-auto zoom-out-pop" alt="star">
            </div>
            <h2 class="text-3xl font-bold text-green-600 mb-2">Wonderful!</h2>
            <p class="text-slate-600 mb-6 font-medium">You solved the addition problem perfectly!</p>
            <button onclick="closeModal()" class="bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 w-full">
                Play Again
            </button>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-600 mb-2">Emoji Addition</h1>
            <p class="text-slate-600 font-medium text-lg">🐶 Drag the animals to count, or drag a number to answer! 🐱</p>
            <div class="mt-4 flex justify-center items-center gap-2">
                <div class="bg-white px-6 py-2 rounded-full shadow-sm text-yellow-600 border-2 border-yellow-200 flex items-center gap-3 text-2xl font-bold">
                    <img src="https://media-public.canva.com/3mBA8/MAG8el3mBA8/1/tl.png" class="w-8 h-8" alt="score star">
                    <span id="score" class="score-val">0</span>
                </div>
            </div>
        </header>

        <main class="grid grid-cols-1 gap-6">
            <section class="bg-white rounded-3xl p-8 shadow-xl border-4 border-white">
                <div class="flex flex-col items-center gap-12">
                    <div class="flex items-end justify-center gap-4 md:gap-8 flex-wrap">
                        <!-- Left Number -->
                        <div class="flex flex-col items-center">
                            <div id="source-1" class="source-box bg-red-50 border-2 border-dashed border-red-200 mb-4 p-2"></div>
                            <span id="num1" class="text-6xl text-slate-700"></span>
                        </div>
                        
                        <span class="text-5xl text-slate-300 mb-2 font-bold">+</span>
                        
                        <!-- Right Number -->
                        <div class="flex flex-col items-center">
                            <div id="source-2" class="source-box bg-yellow-50 border-2 border-dashed border-yellow-200 mb-4 p-2"></div>
                            <span id="num2" class="text-6xl text-slate-700"></span>
                        </div>
                        
                        <span class="text-5xl text-slate-300 mb-2 font-bold">=</span>
                        
                        <!-- Interaction Zone -->
                        <div class="flex flex-col items-center">
                            <div id="collection-target" class="collection-area mb-4 object-drop-zone"></div>
                            <div id="drop-target" class="drop-zone w-20 h-20 bg-blue-50 rounded-2xl border-4 border-dashed border-blue-300 flex items-center justify-center text-6xl text-blue-600 font-bold">
                            </div>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="w-full pt-6 border-t border-slate-100">
                        <p class="text-center text-sm font-bold text-blue-500 uppercase tracking-widest mb-4 ui-text">Pick the total number</p>
                        <div id="options-container" class="flex flex-wrap justify-center gap-4"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        (function() {
            // ----- EMOJI ANIMALS – completely offline, no images needed -----
            const EMOJI_LIST = [
                '🦁',  // lion
                '🐥',  // chick (baby chicken)
                '🦀',  // crab
                '🐿️',  // squirrel
                '🦋',  // butterfly
                '🐝'   // bee
            ];

            // Also add some cute alternates to keep variety fresh
            const EXTRA_EMOJI = ['🐶', '🐱', '🐼', '🐨', '🦊', '🐸', '🐧'];

            // Combine them – we'll pick randomly from the combined pool
            const ALL_ANIMALS = [...EMOJI_LIST, ...EXTRA_EMOJI];

            let score = 0;
            let correctAnswer = 0;
            let objectsCollected = 0;
            let isCorrect = false;
            let draggedItem = null;

            // Sound System using Web Audio API
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            function playSound(type) {
                if (audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'drop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'wrong') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + (i * 0.1));
                        g.gain.setValueAtTime(0.2, now + (i * 0.1));
                        g.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.1) + 0.4);
                        o.start(now + (i * 0.1));
                        o.stop(now + (i * 0.1) + 0.4);
                    });
                }
            }
            
            function init() {
                generateProblem();
                setupDropZones();
                document.body.addEventListener('click', () => {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                }, { once: true });
            }

            function generateProblem() {
                // Generate two numbers whose sum is up to 20
                // Each addend is between 1 and 10, sum capped at 20
                let n1, n2;
                do {
                    n1 = Math.floor(Math.random() * 10) + 1;          // 1–10
                    n2 = Math.floor(Math.random() * 10) + 1;          // 1–10
                } while (n1 + n2 > 20);                                // ensure sum ≤ 20

                correctAnswer = n1 + n2;
                objectsCollected = 0;
                isCorrect = false;
                
                document.getElementById('num1').textContent = n1;
                document.getElementById('num2').textContent = n2;
                
                const dropTarget = document.getElementById('drop-target');
                dropTarget.className = 'drop-zone w-20 h-20 bg-blue-50 rounded-2xl border-4 border-dashed border-blue-300 flex items-center justify-center text-6xl text-blue-600 font-bold';
                dropTarget.textContent = '';

                const collection = document.getElementById('collection-target');
                collection.innerHTML = '';
                collection.classList.remove('active');
                collection.style.borderColor = "#94a3b8";
                collection.style.background = "#f8fafc";

                renderSources(n1, n2);
                renderOptions(correctAnswer);
            }

            function renderSources(n1, n2) {
                const s1 = document.getElementById('source-1');
                const s2 = document.getElementById('source-2');
                s1.innerHTML = ''; s2.innerHTML = '';
                
                // pick a random emoji for this round (both sides same for consistency)
                const selectedEmoji = ALL_ANIMALS[Math.floor(Math.random() * ALL_ANIMALS.length)];

                for(let i=0; i<n1; i++) s1.appendChild(createDraggableEmoji(selectedEmoji));
                for(let i=0; i<n2; i++) s2.appendChild(createDraggableEmoji(selectedEmoji));

                attachListeners();
            }

            function createDraggableEmoji(emoji) {
                const div = document.createElement('div');
                div.textContent = emoji;
                div.className = 'item-emoji';
                div.draggable = true;
                div.dataset.type = 'object';
                // no error needed – emojis always work
                return div;
            }

            function attachListeners() {
                document.querySelectorAll('[draggable="true"]').forEach(el => {
                    el.removeEventListener('dragstart', dragStartHandler);
                    el.addEventListener('dragstart', dragStartHandler);
                });
            }

            function dragStartHandler(e) {
                draggedItem = e.target;
                e.dataTransfer.setData('text/plain', e.target.dataset.type || '');
                // for emoji, we can also set drag image if needed, but default is fine
            }

            function renderOptions(correct) {
                const container = document.getElementById('options-container');
                container.innerHTML = '';
                let choices = [correct];
                // Distractors should be plausible sums near the answer, up to 20
                while(choices.length < 4) {
                    let r = Math.floor(Math.random() * 20) + 1;        // 1–20
                    if(!choices.includes(r)) choices.push(r);
                }
                choices.sort(() => Math.random() - 0.5);

                choices.forEach(val => {
                    const tile = document.createElement('div');
                    tile.className = 'option-tile w-14 h-14 bg-white rounded-2xl shadow-lg border-2 border-blue-100 flex items-center justify-center text-3xl cursor-grab hover:scale-105 transition-transform text-slate-700';
                    tile.textContent = val;
                    tile.draggable = true;
                    tile.dataset.type = 'answer';
                    tile.addEventListener('dragstart', dragStartHandler);
                    container.appendChild(tile);
                });
            }

            function setupDropZones() {
                const collection = document.getElementById('collection-target');
                document.addEventListener('dragover', (e) => e.preventDefault());

                collection.addEventListener('dragenter', () => collection.classList.add('active'));
                collection.addEventListener('dragleave', () => collection.classList.remove('active'));

                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const target = e.target.closest('.object-drop-zone') || e.target.closest('#drop-target');
                    if (!target || !draggedItem) return;

                    const type = draggedItem.dataset.type;

                    if (target.id === 'collection-target' && type === 'object') {
                        // clone the emoji
                        const clone = draggedItem.cloneNode(true);
                        clone.draggable = false;
                        clone.style.cursor = 'default';
                        clone.style.transform = 'scale(0.9)';
                        target.appendChild(clone);
                        draggedItem.remove();
                        objectsCollected++;
                        
                        playSound('drop');
                        
                        if(objectsCollected === correctAnswer) {
                            collection.style.borderColor = "#10b981";
                            collection.style.background = "#ecfdf3";
                        } else {
                            collection.style.borderColor = "#3b82f6";
                        }
                    } 
                    else if (target.id === 'drop-target' && type === 'answer') {
                        checkAnswer(parseInt(draggedItem.textContent), target);
                    }
                    
                    collection.classList.remove('active');
                    draggedItem = null;
                });
            }

            function checkAnswer(val, target) {
                if (val === correctAnswer) {
                    isCorrect = true;
                    target.textContent = val;
                    target.className = 'drop-zone w-20 h-20 rounded-2xl border-4 flex items-center justify-center text-6xl font-bold correct text-green-700';
                    score += 1;
                    document.getElementById('score').textContent = score;
                    playSound('correct');
                    setTimeout(() => showModal(true), 1000);
                } else {
                    target.classList.add('wrong');
                    playSound('wrong');
                    setTimeout(() => {
                        target.classList.remove('wrong');
                    }, 500);
                }
            }

            function showModal(correct) {
                if (!correct) return;
                
                playSound('win');

                const modal = document.getElementById('congrats-modal');
                const starImg = document.querySelector('#modal-emoji img');

                starImg.classList.remove('zoom-out-pop');
                void starImg.offsetWidth; 
                starImg.classList.add('zoom-out-pop');
                
                modal.style.display = 'flex';
            }

            window.closeModal = function() {
                document.getElementById('congrats-modal').style.display = 'none';
                if (isCorrect) generateProblem();
            };

            window.onload = init;
        })();
    </script>
</body>
</html>
